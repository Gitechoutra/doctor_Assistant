[flask]
env = development
 
[server]
sqlalchemy_database_uri = mysql+pymysql://root:%(DB_PASSWORD)s@127.0.0.1:3306/yasodha_ai?charset=utf8mb4
sqlalchemy_track_modifications = False
sqlalchemy_echo = False
app_secret_key = %(APP_SECRET_KEY)s
; The host every emailed link is built from -- the sign-in URL and the
; "set your password" URL both hang off it.
;
; NOT localhost. A staff member reads that email on their own machine, where
; localhost is their machine, so a link naming it either refuses the
; connection or lands on whatever they happen to be running. It has to be an
; address the recipient can reach: this laptop's address on the office
; network for now, and a real hostname once the portal is deployed.
;
; If the Wi-Fi hands out a different address, update this line -- `ipconfig`
; shows it. Both dev servers must be reachable on it too: Vite already binds
; every interface (frontend/vite.config.js), and app.py serves 0.0.0.0.
frontend_base_url = http://localhost:5173
; Both origins: the same browser session works whether it was opened as
; localhost on this machine or by address from another.
cors_origins =  http://localhost:5173
 
[jwt]
secret_key = %(JWT_SECRET_KEY)s
access_token_expires_minutes = 480
refresh_token_expires_days = 30
 
; The same connection, part by part. Not redundant: the pool settings hang off
; it, the _test database name is derived from `name`, and each part is
; percent-encoded when a URL is assembled -- so a password containing @ : / ?
; or # needs no escaping by hand, which the single URI above cannot promise.
; Keep the two in step. The URI wins if they ever disagree.
[database]
host = 127.0.0.1
port = 3306
name = yasodha_ai
user = root
password = %(DB_PASSWORD)s
charset = utf8mb4
pool_size = 10
max_overflow = 20
pool_timeout = 30
pool_recycle = 280
 
[mail_server_Email]
; Staff credentials and password-reset links. Gmail needs an App Password
; (Google Account -> Security -> 2-Step Verification -> App passwords); the
; ordinary account password is refused outright by SMTP AUTH.
;
; Leave mailserver_domain blank to put the portal into log-only mode: each
; message is written to logs/portal.log, reset link included, instead of being
; sent. That is what makes a checkout with no mail account usable.
mailserver_domain = smtp.gmail.com
mailserver_port = 587
mailserver_use_tls = True
mailserver_use_ssl = False
MAILSERVER_USERNAME = %(SMTP_USER)s
MAILSERVER_PASSWORD = %(SMTP_PASSWORD)s
mailserver_default_sender = Yasodha Hospitals <%(SMTP_USER)s>
; Stops sending everywhere at once without unpicking the credentials above;
; messages fall back to being logged.
enabled = true
 
[password_reset]
; No reset_token_secret or reset_token_salt here, unlike the house template:
; this portal does not sign its reset tokens. Each one is 32 random bytes and
; only its SHA-256 is stored (see models/password_reset_token.py), so there is
; no secret whose leak would let anybody mint a link, and no salt to rotate.
;
; How long the "set your password" link in a credentials email stays usable,
; and how long a self-service reset link does. The invite window is the longer
; of the two: a new joiner may not read the message until their first shift,
; whereas somebody who just pressed "forgot password" is at the keyboard now.
invite_token_hours = 72
reset_token_minutes = 60
 
[gemini]
api_key = %(GEMINI_API_KEY)s
model = gemini-flash-latest
 
[upload_folder]
upload_folder = uploads
 
[hospital]
; The letterhead on printed reports, and the footer of every email the portal
; sends.
name = Yasodha Hospitals
tagline = Compassionate care, every day
address = 12-3-456, Beside Bus Stand, Kakinada, Andhra Pradesh 533001
phone = +91 884 234 5678
email = care@yasodhahospitals.com
website = www.yasodhahospitals.com
 