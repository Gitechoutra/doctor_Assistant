# Serves the built React app. Static files only -- the API stays where it has
# always been, on the backend's own origin (:5000), reached directly by the
# browser and allowed through Flask-CORS. No reverse proxy here on purpose:
# proxying /api would change the origin the frontend calls and the one
# socket.io connects to, which is exactly the behaviour that must not change.

server {
    # The unprivileged image's port. Published as 5173 on the host by
    # compose.yaml, matching the port the app is developed on.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A blank page with a mangled asset is worse than a slow one.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container-local, for the image's HEALTHCHECK.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite writes content-hashed filenames into /assets, so they can be
    # cached hard and for a long time.
    #
    # The security headers are repeated in both blocks below on purpose:
    # nginx's add_header is inherited only by a location that declares none of
    # its own, so setting Cache-Control here would otherwise silently drop
    # nosniff from exactly the JavaScript and CSS responses that most want it.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # asking for asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # React Router owns the URL space: /doctor/queue and every other route is
    # rendered by the app, not by a file on disk. Without this fallback a
    # refresh on any route but / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
