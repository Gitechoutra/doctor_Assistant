# MediAssist AI -- full stack, as the application already works.
#
#   docker compose -f docker/compose.yaml up -d --build
#
# Three services and the same shape the project runs in on a developer's
# machine: a React app served on 5173, a Flask + Socket.IO API on 5000 that
# the browser calls across an origin Flask-CORS allows, and MySQL behind them.
# Nothing about the application's structure, routes or ports is changed.
#
# Configuration comes from docker/.env (copy docker/.env.example). No
# credential is written down in this file.

name: mediassist

services:
  # ---------------------------------------------------------------------
  # MySQL 8.4 (LTS)
  # ---------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      # `doctor` is not an arbitrary default: database/schema.sql names that
      # database in its own CREATE DATABASE / USE statements, and that file is
      # the project's, not this setup's, so it is not edited here. Changing
      # the name means editing the schema too.
      MYSQL_DATABASE: ${DB_NAME:-doctor}
      # The app connects as this account, not as root.
      MYSQL_USER: ${DB_USER:-mediassist}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
    command:
      # utf8mb4 end to end: consultation transcripts carry Telugu, Hindi and
      # Tamil text, and the connection URL config.py builds already asks for
      # it -- this makes the server agree.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # The application's own schema snapshot, read-only, imported on the
      # first start of an empty volume. Read-only matters: an init script is
      # a file MySQL is handed, and the project's copy must not be writable
      # by a container.
      - ../database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./mysql/init/20-test-database.sh:/docker-entrypoint-initdb.d/20-test-database.sh:ro
      - db_data:/var/lib/mysql
    # Deliberately not published to the host. Nothing outside this network
    # needs to reach MySQL; `docker compose -f docker/compose.yaml exec db
    # mysql -u root -p` is how you get a prompt. Uncomment only if a desktop
    # client genuinely has to connect.
    # ports:
    #   - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      # --protocol=TCP on purpose. During the first-run import MySQL listens
      # on a socket only, so a TCP ping stays red until the schema is in and
      # the real server is up -- which is what the backend must wait for.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    networks:
      - mediassist

  # ---------------------------------------------------------------------
  # Flask API + Socket.IO  (backend/app.py, unchanged)
  # ---------------------------------------------------------------------
  backend:
    build:
      # The project root, so the image can copy backend/ as it stands.
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        # true puts torch + openai-whisper back in the image. Neither is
        # imported anywhere in backend/, so the default leaves them out --
        # see backend.Dockerfile.
        INSTALL_TRANSCRIBER_EXTRAS: ${INSTALL_TRANSCRIBER_EXTRAS:-false}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # config/config.py reads real environment variables first, before any
      # ini file, so everything below simply wins. APP_ENV=production also
      # points it at config/prod.ini -- a file that does not exist and is not
      # created here, which is what keeps the container's configuration
      # entirely in the environment.
      APP_ENV: production

      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in docker/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in docker/.env}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-480}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}

      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-doctor}
      DB_USER: ${DB_USER:-mediassist}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      DB_CHARSET: utf8mb4

      # The origin the browser loads the app from -- both the CORS allow-list
      # and the base of every link the portal emails. They are the same value
      # for the same reason they are in dev.ini: the page and the API it calls
      # are named by the same host.
      CORS_ORIGINS: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      PORTAL_BASE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-gmail.com,outlook.com}

      # Optional. Blank is a working configuration for each of these: no key
      # disables the AI drafting, no SMTP host makes helpers/email log the
      # message instead of sending it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}

      PRACTICE_NAME: ${PRACTICE_NAME:-MediAssist AI}
      PRACTICE_ADDRESS: ${PRACTICE_ADDRESS:-}
      PRACTICE_PHONE: ${PRACTICE_PHONE:-}
      PRACTICE_EMAIL: ${PRACTICE_EMAIL:-}
      PRACTICE_WEBSITE: ${PRACTICE_WEBSITE:-}

      # The doctor's login. Left unset, the account is seeded from
      # portal/seeders/seed_doctor.py exactly as it is today -- the login is
      # not changed by containerising. Set them to override without editing
      # that file; SEED_ACCOUNT_SYNC=false freezes an account already in use.
      SEED_DOCTOR_NAME: ${SEED_DOCTOR_NAME:-}
      SEED_DOCTOR_EMAIL: ${SEED_DOCTOR_EMAIL:-}
      SEED_DOCTOR_PASSWORD: ${SEED_DOCTOR_PASSWORD:-}
      SEED_ACCOUNT_SYNC: ${SEED_ACCOUNT_SYNC:-true}
    ports:
      # 5000 is the port app.py binds and the port frontend/.env.example
      # documents. BACKEND_HOST_PORT exists because another application on
      # this machine also binds 5000 -- change it there and in
      # PUBLIC_API_BASE_URL together, since the browser calls the published
      # port by name.
      - "${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      # Avatars, patient photos and the generated prescription / report /
      # appointment-slip PDFs. A real volume because losing them loses part
      # of the clinical record.
      - backend_uploads:/app/backend/uploads
      # portal/logger.py's rotating handler. Kept so a crash is still
      # readable after `docker compose down`.
      - backend_logs:/app/backend/logs
    security_opt:
      - no-new-privileges:true
    networks:
      - mediassist

  # ---------------------------------------------------------------------
  # React app, built and served as static files by nginx
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        # Baked in at build time -- Vite inlines import.meta.env. This is the
        # address the browser uses, so it names the published backend port on
        # the host, never the `backend` service name.
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      # Ordering only. The page is static and loads fine on its own; this
      # just avoids a first visit that renders and then fails every call.
      backend:
        condition: service_started
    ports:
      # 5173 on the host, the port the app is developed on and the one the
      # backend's CORS allow-list and emailed links name. 8080 inside,
      # because the nginx image runs unprivileged.
      - "${FRONTEND_HOST_PORT:-5173}:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - mediassist

volumes:
  db_data:
  backend_uploads:
  backend_logs:

networks:
  mediassist:
    driver: bridge
